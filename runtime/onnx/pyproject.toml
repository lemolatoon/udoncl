[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "udon-onnx-runtime"
version = "0.1.0"
description = "ONNX parser and extensible UdonDNN/UdonBLAS execution-plan compiler"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
udon-onnx = "udon_onnx:main"
udon-onnx-pack = "udon_weights:main"

[project.optional-dependencies]
weights = ["numpy>=2.1"]

[tool.setuptools]
py-modules = ["udon_onnx", "udon_weights"]

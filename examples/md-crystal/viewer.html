<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>udoncl · 触れる結晶</title>
<style>
body{margin:0;background:#0b1220;color:#e7eefb;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#abbcd5;line-height:1.6}canvas{width:100%;aspect-ratio:1.25;display:block;border:1px solid #31405a;border-radius:12px;touch-action:none;background:#101b2d}.controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:18px 0}button{background:#263b58;color:white;border:1px solid #456083;padding:9px 16px;border-radius:7px;cursor:pointer}label{display:flex;align-items:center;gap:8px}#status{font:14px ui-monospace,monospace;color:#acbdd4}.legend{display:flex;align-items:center;gap:8px}.gradient{height:10px;width:120px;background:linear-gradient(90deg,#4388ff,#61e3be,#ffd25b,#ff6557);border-radius:8px}
</style>
<main><h1>触れる結晶 <small style="font-size:15px;color:#8ca5c5">udoncl / native Fragment MD</small></h1>
<p>押しながらなぞると、その場所が加熱されて氷の結晶秩序が崩れます。タッチは2本指まで。手を離すと熱浴へ放熱し、液体から再び氷へ戻ります。</p>
<canvas id="view" width="1000" height="800"></canvas>
<div class="controls"><button id="pause">一時停止</button><button id="reset">リセット</button><label>加熱 <input id="heat" type="range" min="0" max="0.12" step="0.005" value="0.04"></label><label>速度 <input id="speed" type="range" min="1" max="40" step="1" value="12"></label><span class="legend">低温 <span class="gradient"></span> 高温</span></div>
<div id="status">接続中…</div><p>32粒子・3次元FCC Lennard–Jones 結晶 / 3軸周期境界 / 換算単位。立方体を回転投影し、色は粒子の運動エネルギーです。</p></main>
<script>
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
const pointers=new Map();let state=null,paused=false,reset=false;
function geometry(){const margin=55,scale=Math.min((canvas.width-2*margin)/state.box[0],(canvas.height-2*margin)/state.box[1]);return {scale,x:(canvas.width-scale*state.box[0])/2,y:(canvas.height-scale*state.box[1])/2};}
function pointer(e){const r=canvas.getBoundingClientRect(),g=geometry();return [((e.clientX-r.left)*canvas.width/r.width-g.x)/g.scale,((e.clientY-r.top)*canvas.height/r.height-g.y)/g.scale];}
canvas.onpointerdown=e=>{if(!state||pointers.size>=2)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pointer(e));};
canvas.onpointermove=e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,pointer(e));};
canvas.onpointerup=canvas.onpointercancel=e=>pointers.delete(e.pointerId);
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'再開':'一時停止';};
document.querySelector('#reset').onclick=()=>{reset=true;};
function image(x,box){return x-box*Math.round(x/box);}
function draw(){const s=state.state,box=state.box[0],angle=performance.now()*.00018,c=Math.cos(angle),sn=Math.sin(angle);ctx.clearRect(0,0,1000,800);const points=[];for(let i=0;i<32;i++){let x=s[8*i]/box-.5,y=s[8*i+1]/box-.5,z=s[8*i+2]/box-.5;const rx=c*x+sn*z,rz=-sn*x+c*z,depth=1.5+rz;points.push({x:500+560*rx/depth,y:400-560*y/depth,z:rz,r:15/depth,v:s[8*i+4]**2+s[8*i+5]**2+s[8*i+6]**2});}points.sort((a,b)=>b.z-a.z);for(const p of points){const t=Math.min(1,p.v*3);ctx.fillStyle=`hsl(${205-200*t} 88% ${65-8*t}%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,2*Math.PI);ctx.fill();}const phase={ice:'氷',melting:'融解中',liquid:'液体'}[state.phase]||state.phase;status.textContent=`${phase} · step ${state.frame} · T=${state.temperature.toFixed(4)} · Q6=${state.bond_order_6.toFixed(3)} · ${paused?'paused':'running'}`;}
async function tick(){try{if(!state)state=await(await fetch('/state')).json();const hands=[...pointers.values()].map(([x,y])=>[x,y,state.box[2]/2]);while(hands.length<2)hands.push([-100,-100,-100]);const response=await fetch('/step',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reset,steps:paused?0:Number(document.querySelector('#speed').value),hands,amplitude:Number(document.querySelector('#heat').value)})});reset=false;const next=await response.json();if(!response.ok)throw Error(next.error);state=next;draw();setTimeout(tick,16);}catch(e){status.textContent='停止: '+e.message;}}
tick();
</script></html>

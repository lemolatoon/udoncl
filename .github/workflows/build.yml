name: Compiler host build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  vpm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate VPM package
        run: python scripts/validate_vpm_package.py
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned formatters
        run: python -m pip install -r scripts/requirements-format.txt
      - name: Check formatting
        run: python scripts/format.py --check
  build:
    strategy:
      fail-fast: false
      matrix:
        # The locked community SDK is built/tested with VS 2026 on windows-2025.
        # Older MSVC STL libraries cannot satisfy its __std_* references.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ONNX weight packer test dependency
        run: python -m pip install -r scripts/requirements-onnx.txt
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          # Use the image's latest VS: this action caps numeric selections at
          # minor .9, which excludes current VS 2026 versions such as 18.11.
      - name: Restore pinned LLVM and MLIR
        uses: actions/cache/restore@v4
        id: llvm
        with:
          path: .deps/llvm23
          key: llvm-sdk-archive-v3-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('cmake/llvm-lock.json', 'scripts/install_llvm.py', 'scripts/requirements-llvm.txt') }}
      - name: Install archive extraction dependency
        if: steps.llvm.outputs.cache-hit != 'true'
        run: python -m pip install -r scripts/requirements-llvm.txt
      - name: Install pinned prebuilt LLVM and MLIR
        if: steps.llvm.outputs.cache-hit != 'true'
        run: python scripts/install_llvm.py --discard-downloads
      - name: Validate restored or installed SDK
        run: python scripts/install_llvm.py --check
      # Save before project configure/build/tests, so their failures do not
      # discard a verified SDK. Cache misses download archives; never build LLVM.
      - name: Save pinned LLVM and MLIR
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/llvm23
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      - name: Install Linux SDK libraries and shader validator
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zlib1g-dev libzstd-dev libxml2-dev glslang-tools libvulkan-dev mesa-vulkan-drivers
      - run: cmake --preset udoncl -DVRC_ENABLE_NATIVE_FRAGMENT_TESTS=ON
      - run: python scripts/build.py
      - run: ctest --preset udoncl

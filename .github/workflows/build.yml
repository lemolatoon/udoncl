name: Compiler host build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/cache@v4
        id: llvm
        with:
          path: .deps/llvm23
          key: llvm23-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/llvm-lock.json', 'scripts/build_llvm.py') }}
      - name: Build pinned LLVM and MLIR
        if: steps.llvm.outputs.cache-hit != 'true'
        run: python scripts/build_llvm.py --jobs 2
      - run: cmake --preset llvm23
      - run: cmake --build --preset llvm23
      - run: ctest --preset llvm23

name: Compiler host build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Restore pinned LLVM and MLIR
        uses: actions/cache/restore@v4
        id: llvm
        with:
          path: .deps/llvm23
          key: llvm-sdk-v2-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('cmake/llvm-lock.json', 'scripts/build_llvm.py') }}
      - name: Build pinned LLVM and MLIR
        if: steps.llvm.outputs.cache-hit != 'true'
        run: python scripts/build_llvm.py --jobs 2
      # Save before project configure/build/tests, so their failures do not
      # discard a successfully built SDK. Never save an incomplete LLVM build.
      - name: Save pinned LLVM and MLIR
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/llvm23
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      - run: cmake --preset udoncl
      - run: cmake --build --preset udoncl
      - run: ctest --preset udoncl
